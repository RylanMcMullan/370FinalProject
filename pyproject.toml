[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-password-manager"
version = "0.1.0"
description = "A small local encrypted password manager"
requires-python = ">=3.10"
dependencies = ["argon2-cffi>=23.1,<26", "cryptography>=42,<47"]

[project.scripts]
password-manager = "password_manager.cli:main"

[tool.setuptools.packages.find]
include = ["password_manager*"]
