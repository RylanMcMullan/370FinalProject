[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-password-manager"
version = "0.1.0"
description = "A small local encrypted password manager"
requires-python = ">=3.10"
dependencies = ["argon2-cffi==25.1.0", "cryptography==46.0.7", "zxcvbn==4.5.0"]

[project.scripts]
password-manager = "password_manager.cli:main"

[tool.setuptools.packages.find]
include = ["password_manager*"]
